<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 人格测试</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #fafafa;
  color: #1a1a1a;
  min-height: 100vh;
}

.container {
  max-width: 780px;
  margin: 0 auto;
  padding: 0 20px;
}

.page {
  display: none;
  min-height: 100vh;
}

.page.active {
  display: flex;
  flex-direction: column;
}

/* ========== 首页 ========== */
#intro {
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 40px 20px;
}

#intro h1 {
  font-size: 2.4rem;
  font-weight: 700;
  margin-bottom: 16px;
  letter-spacing: -0.5px;
}

#intro .subtitle {
  font-size: 1.1rem;
  color: #888;
  margin-bottom: 48px;
}

#intro .start-btn {
  display: inline-block;
  background: #000;
  color: #fff;
  border: none;
  padding: 16px 48px;
  font-size: 1.1rem;
  font-weight: 500;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s;
  font-family: inherit;
}

#intro .start-btn:hover {
  background: #333;
}

#intro .disclaimer {
  margin-top: 48px;
  font-size: 0.85rem;
  color: #888;
}

/* ========== 答题页 ========== */
#quiz {
  min-height: 100vh;
  padding-bottom: 80px;
}

.progress-bar-wrapper {
  position: sticky;
  top: 0;
  background: #fafafa;
  padding: 16px 0 12px;
  z-index: 10;
}

.progress-text {
  font-size: 0.85rem;
  color: #888;
  margin-bottom: 8px;
  text-align: right;
}

.progress-track {
  width: 100%;
  height: 4px;
  background: #e8e8e4;
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: #000;
  border-radius: 2px;
  transition: width 0.3s ease;
  width: 0%;
}

.question-card {
  background: #fff;
  border: 1px solid #e8e8e4;
  border-radius: 14px;
  padding: 36px 32px;
  margin-top: 24px;
  flex: 1;
}

.question-label {
  font-size: 0.85rem;
  color: #888;
  margin-bottom: 12px;
  font-weight: 500;
}

.question-text {
  font-size: 1.3rem;
  font-weight: 600;
  margin-bottom: 32px;
  line-height: 1.6;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.option-btn {
  display: block;
  width: 100%;
  text-align: left;
  background: #fff;
  border: 1.5px solid #e8e8e4;
  border-radius: 8px;
  padding: 16px 20px;
  font-size: 1rem;
  line-height: 1.5;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  font-family: inherit;
  color: #1a1a1a;
}

.option-btn:hover {
  background: #f5f5f5;
}

.option-btn.selected {
  border-color: #000;
  background: #f5f5f5;
}

.quiz-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #fafafa;
  border-top: 1px solid #e8e8e4;
  padding: 16px 20px;
  z-index: 10;
}

.quiz-nav .container {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.prev-btn {
  background: none;
  border: 1.5px solid #e8e8e4;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 0.95rem;
  cursor: pointer;
  color: #1a1a1a;
  transition: border-color 0.2s, background 0.2s;
  font-family: inherit;
}

.prev-btn:hover {
  border-color: #000;
  background: #f5f5f5;
}

.prev-btn.hidden {
  visibility: hidden;
}

.submit-btn {
  background: #000;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 24px;
  font-size: 0.95rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s;
  font-family: inherit;
  display: none;
}

.submit-btn:hover {
  background: #333;
}

.submit-btn.show {
  display: block;
}

/* ========== 加载页 ========== */
#loading {
  justify-content: center;
  align-items: center;
  text-align: center;
}

.loading-text {
  font-size: 1.3rem;
  font-weight: 500;
  margin-bottom: 24px;
}

.dots {
  display: flex;
  gap: 8px;
  justify-content: center;
}

.dot {
  width: 10px;
  height: 10px;
  background: #000;
  border-radius: 50%;
  animation: bounce 1.2s infinite ease-in-out;
}

.dot:nth-child(2) {
  animation-delay: 0.2s;
}

.dot:nth-child(3) {
  animation-delay: 0.4s;
}

@keyframes bounce {
  0%, 80%, 100% {
    transform: translateY(0);
    opacity: 0.3;
  }
  40% {
    transform: translateY(-12px);
    opacity: 1;
  }
}

/* ========== 结果页 ========== */
#results {
  padding: 40px 0 60px;
  min-height: auto;
}

#resultContent {
  background: #fafafa;
  padding: 0 20px 40px;
}

.result-main-card {
  background: #fff;
  border: 1px solid #e8e8e4;
  border-radius: 14px;
  padding: 36px 32px;
  display: flex;
  gap: 28px;
  align-items: flex-start;
  margin-bottom: 24px;
}

.result-emoji {
  font-size: 3.6rem;
  flex-shrink: 0;
}

.result-info h2 {
  font-size: 1.6rem;
  font-weight: 700;
  margin-bottom: 4px;
}

.result-code {
  font-size: 1.1rem;
  color: #888;
  font-weight: 500;
  margin-bottom: 14px;
}

.result-desc {
  font-size: 0.95rem;
  line-height: 1.8;
  color: #555;
}

.dims-card {
  background: #fff;
  border: 1px solid #e8e8e4;
  border-radius: 14px;
  padding: 28px 32px;
  margin-bottom: 24px;
}

.dims-card h3 {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 20px;
}

.dim-row {
  display: flex;
  align-items: center;
  margin-bottom: 16px;
  gap: 12px;
}

.dim-row:last-child {
  margin-bottom: 0;
}

.dim-label {
  font-size: 0.9rem;
  font-weight: 500;
  width: 56px;
  text-align: right;
  flex-shrink: 0;
}

.dim-label.right {
  text-align: left;
}

.dim-bar-track {
  flex: 1;
  height: 10px;
  background: #e8e8e4;
  border-radius: 5px;
  overflow: hidden;
}

.dim-bar-fill {
  height: 100%;
  background: #000;
  border-radius: 5px;
  transition: width 0.5s ease;
}

.dim-pct {
  font-size: 0.85rem;
  color: #888;
  width: 40px;
  flex-shrink: 0;
}

.dim-pct.left {
  text-align: right;
}

.dim-pct.right {
  text-align: left;
}

.traits-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}

.traits-card {
  background: #fff;
  border: 1px solid #e8e8e4;
  border-radius: 14px;
  padding: 24px;
}

.traits-card h3 {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 14px;
}

.traits-card ul {
  list-style: none;
  padding: 0;
}

.traits-card li {
  font-size: 0.9rem;
  color: #555;
  line-height: 1.6;
  padding: 4px 0;
}

.traits-card li::before {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  background: #000;
  border-radius: 50%;
  margin-right: 10px;
  vertical-align: middle;
}

.celebs-card {
  background: #fff;
  border: 1px solid #e8e8e4;
  border-radius: 14px;
  padding: 28px 32px;
  margin-bottom: 24px;
}

.celebs-card h3 {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 16px;
}

.celebs-list {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.celeb-tag {
  background: #f5f5f5;
  border: 1px solid #e8e8e4;
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 0.9rem;
}

.tip-card {
  background: #fff;
  border: 1px solid #e8e8e4;
  border-radius: 14px;
  padding: 24px 32px;
  margin-bottom: 24px;
}

.tip-card h3 {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 10px;
}

.tip-card p {
  font-size: 0.9rem;
  color: #555;
  line-height: 1.8;
}

.watermark {
  display: none;
  text-align: center;
  padding: 20px 0 8px;
  border-top: 1px solid #e8e8e4;
  margin-top: 16px;
}

.watermark .wm-title {
  font-size: 0.9rem;
  font-weight: 500;
  color: #888;
}

.watermark .wm-link {
  font-size: 0.8rem;
  color: #aaa;
  margin-top: 4px;
}

.result-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  padding: 0 20px;
  margin-top: 24px;
}

.save-btn {
  background: #000;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 14px 32px;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s;
  font-family: inherit;
}

.save-btn:hover {
  background: #333;
}

.restart-btn {
  background: #fff;
  color: #1a1a1a;
  border: 1.5px solid #e8e8e4;
  border-radius: 8px;
  padding: 14px 32px;
  font-size: 1rem;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  font-family: inherit;
}

.restart-btn:hover {
  border-color: #000;
  background: #f5f5f5;
}

/* ========== 响应式 ========== */
@media (max-width: 600px) {
  #intro h1 {
    font-size: 1.8rem;
  }

  .question-card {
    padding: 28px 20px;
  }

  .question-text {
    font-size: 1.15rem;
  }

  .result-main-card {
    flex-direction: column;
    padding: 28px 20px;
    gap: 16px;
  }

  .traits-grid {
    grid-template-columns: 1fr;
  }

  .dims-card,
  .celebs-card,
  .tip-card {
    padding: 20px;
  }

  .result-actions {
    flex-direction: column;
  }

  .result-actions button {
    width: 100%;
  }
}
</style>
</head>
<body>

<!-- 首页 -->
<div id="intro" class="page active">
  <div class="container">
    <h1>你是什么人格？</h1>
    <p class="subtitle">28 道有趣的题目，测出你的 MBTI 类型</p>
    <button class="start-btn" onclick="startTest()">开始测试</button>
    <p class="disclaimer">本测试仅供娱乐，请勿当真</p>
  </div>
</div>

<!-- 答题页 -->
<div id="quiz" class="page">
  <div class="container">
    <div class="progress-bar-wrapper">
      <div class="progress-text" id="progressText">1/28</div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
    <div id="questionArea"></div>
  </div>
  <div class="quiz-nav">
    <div class="container">
      <button class="prev-btn hidden" id="prevBtn" onclick="prevQuestion()">上一题</button>
      <button class="submit-btn" id="submitBtn" onclick="submitTest()">查看结果</button>
    </div>
  </div>
</div>

<!-- 加载页 -->
<div id="loading" class="page">
  <div>
    <div class="loading-text">正在分析你的人格...</div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</div>

<!-- 结果页 -->
<div id="results" class="page">
  <div class="container">
    <div id="resultContent">
      <!-- 动态渲染 -->
    </div>
    <div class="result-actions">
      <button class="save-btn" onclick="saveAsImage()">保存结果图片</button>
      <button class="restart-btn" onclick="startTest()">重新测试</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    id: 1,
    text: "周末你有一整天没安排，你会怎么度过？",
    dim: "EI",
    options: [{"text": "约朋友出去吃饭逛街，一个人待着浪费", "score": 3}, {"text": "看心情，可能出去也可能在家", "score": 2}, {"text": "终于可以一个人待着了，看书追剧打游戏", "score": 1}]
  },
  {
    id: 2,
    text: "买手机的时候，你更看重什么？",
    dim: "SN",
    options: [{"text": "参数配置、性价比，会仔细对比评测", "score": 3}, {"text": "看看外观和口碑，差不多就行", "score": 2}, {"text": "喜欢就买，感觉对了比参数重要", "score": 1}]
  },
  {
    id: 3,
    text: "朋友跟你吐槽工作不顺心，你一般会？",
    dim: "TF",
    options: [{"text": "帮他分析问题出在哪，看看怎么解决", "score": 3}, {"text": "先听他说完，再看要不要给建议", "score": 2}, {"text": "陪他聊聊，让他把情绪先发泄出来", "score": 1}]
  },
  {
    id: 4,
    text: "出门旅游之前，你通常会？",
    dim: "JP",
    options: [{"text": "做好攻略，订好酒店和行程", "score": 3}, {"text": "大方向定了，细节到时候随机应变", "score": 2}, {"text": "说走就走，到了再说", "score": 1}]
  },
  {
    id: 5,
    text: "到一个新公司入职，午饭时间你会？",
    dim: "EI",
    options: [{"text": "主动问同事要不要一起吃，顺便熟悉一下", "score": 3}, {"text": "跟着大家一起去，但不会特别主动", "score": 2}, {"text": "自己先吃，等熟了再说", "score": 1}]
  },
  {
    id: 6,
    text: "学一个新技能（比如做菜、画画），你倾向于？",
    dim: "SN",
    options: [{"text": "找教程一步步跟着学，先打好基础", "score": 3}, {"text": "看看教程再自己试试，结合着来", "score": 2}, {"text": "直接上手试，做着做着就有感觉了", "score": 1}]
  },
  {
    id: 7,
    text: "你和朋友意见不同的时候，你一般会？",
    dim: "TF",
    options: [{"text": "讲道理摆事实，把想法说清楚", "score": 3}, {"text": "各自表达一下，不会太较真", "score": 2}, {"text": "算了不争了，维持关系比对错重要", "score": 1}]
  },
  {
    id: 8,
    text: "你的桌面/房间通常是什么状态？",
    dim: "JP",
    options: [{"text": "东西都有固定位置，比较整齐", "score": 3}, {"text": "大体还行，偶尔乱一下会收拾", "score": 2}, {"text": "乱但我知道东西在哪，有自己的秩序", "score": 1}]
  },
  {
    id: 9,
    text: "聚会上大家在玩桌游，你通常是？",
    dim: "EI",
    options: [{"text": "很投入，喜欢带动气氛", "score": 3}, {"text": "跟着玩，输赢都开心", "score": 2}, {"text": "参与但不太出头，更喜欢观察", "score": 1}]
  },
  {
    id: 10,
    text: "看完一部电影，你会更关注什么？",
    dim: "SN",
    options: [{"text": "剧情逻辑通不通，有没有bug", "score": 3}, {"text": "整体故事好不好看", "score": 2}, {"text": "电影想表达什么，有什么隐喻", "score": 1}]
  },
  {
    id: 11,
    text: "同事的方案你觉得有问题，你会？",
    dim: "TF",
    options: [{"text": "直接说出来，早发现早改", "score": 3}, {"text": "找个合适的时机私下提一下", "score": 2}, {"text": "看看别人怎么说，不想让他难堪", "score": 1}]
  },
  {
    id: 12,
    text: "手机上的待办事项和日程提醒，你？",
    dim: "JP",
    options: [{"text": "经常用，帮我管理时间", "score": 3}, {"text": "重要的事会记一下", "score": 2}, {"text": "基本不用，都装脑子里", "score": 1}]
  },
  {
    id: 13,
    text: "在一个不太熟的人的饭局上，你？",
    dim: "EI",
    options: [{"text": "主动找话题，很快就能聊起来", "score": 3}, {"text": "别人聊我就接，不会冷场", "score": 2}, {"text": "比较安静，等熟悉了再多说", "score": 1}]
  },
  {
    id: 14,
    text: "做一个重要决定（比如换工作）的时候，你会？",
    dim: "SN",
    options: [{"text": "列出利弊，收集信息仔细分析", "score": 3}, {"text": "既看数据也看感觉，综合考虑", "score": 2}, {"text": "想太多反而犹豫，跟着直觉走", "score": 1}]
  },
  {
    id: 15,
    text: "排队的时候有人插队到你前面，你会？",
    dim: "TF",
    options: [{"text": "直接说：不好意思，请排队", "score": 3}, {"text": "看情况，太过分了会说一句", "score": 2}, {"text": "虽然不爽但算了，不想起冲突", "score": 1}]
  },
  {
    id: 16,
    text: "距离deadline还有一周，你的状态是？",
    dim: "JP",
    options: [{"text": "已经在推进了，提前完成心里踏实", "score": 3}, {"text": "有个大概计划，这两天开始认真弄", "score": 2}, {"text": "还早，最后两天效率最高", "score": 1}]
  },
  {
    id: 17,
    text: "你更享受哪种社交方式？",
    dim: "EI",
    options: [{"text": "一群人热热闹闹的，人多才好玩", "score": 3}, {"text": "三五个好朋友聚聚就挺好", "score": 2}, {"text": "和一两个人深聊比大群更舒服", "score": 1}]
  },
  {
    id: 18,
    text: "开会讨论方案的时候，你更容易注意到？",
    dim: "SN",
    options: [{"text": "具体的执行细节和时间节点", "score": 3}, {"text": "整体方向对不对", "score": 2}, {"text": "这个方案背后的思路和可能性", "score": 1}]
  },
  {
    id: 19,
    text: "看到网上两个人在吵架，你更关注？",
    dim: "TF",
    options: [{"text": "谁的论点更有道理", "score": 3}, {"text": "吃吃瓜看看热闹", "score": 2}, {"text": "被骂的那个人会不会不好受", "score": 1}]
  },
  {
    id: 20,
    text: "你怎么处理家务（洗碗、洗衣服等）？",
    dim: "JP",
    options: [{"text": "定时定量，脏了就收拾", "score": 3}, {"text": "想起来就做，不会积太多", "score": 2}, {"text": "攒到不得不做的时候一次性解决", "score": 1}]
  },
  {
    id: 21,
    text: "路上偶遇一个很久没联系的老同学，你？",
    dim: "EI",
    options: [{"text": "上前打招呼聊几句，说不定约个饭", "score": 3}, {"text": "点头微笑打个招呼", "score": 2}, {"text": "看到了但不太想社交，假装没看见", "score": 1}]
  },
  {
    id: 22,
    text: "你更喜欢哪种类型的书或内容？",
    dim: "SN",
    options: [{"text": "实用类的，能学到具体方法", "score": 3}, {"text": "故事性强的，好看就行", "score": 2}, {"text": "有深度的，能引发思考的", "score": 1}]
  },
  {
    id: 23,
    text: "在二手平台卖东西，买家说能不能便宜点，你？",
    dim: "TF",
    options: [{"text": "价格合理就不让了，明码标价", "score": 3}, {"text": "看情况，少让一点意思一下", "score": 2}, {"text": "行吧行吧给你便宜点，爽快点成交", "score": 1}]
  },
  {
    id: 24,

let answers = {};
let currentQuestion = 0;
let shuffledQuestions;

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function startTest() {
  answers = {};
  currentQuestion = 0;
  advancing = false;
  shuffleQuestions();
  showPage('quiz');
  renderQuestion();
  updateProgress();
}

function shuffleQuestions() {
  const groups = { EI: [], SN: [], TF: [], JP: [] };
  QUESTIONS.forEach(q => {
    if (groups[q.dim]) {
      groups[q.dim].push(q);
    }
  });
  Object.keys(groups).forEach(dim => {
    const arr = groups[dim];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  });
  const dims = ['EI', 'SN', 'TF', 'JP'];
  shuffledQuestions = [];
  const maxLen = Math.max(...Object.values(groups).map(g => g.length));
  for (let i = 0; i < maxLen; i++) {
    for (const dim of dims) {
      if (i < groups[dim].length) {
        shuffledQuestions.push(groups[dim][i]);
      }
    }
  }
}

function renderQuestion() {
  const q = shuffledQuestions[currentQuestion];
  const prevBtn = document.getElementById('prevBtn');
  const submitBtn = document.getElementById('submitBtn');

  prevBtn.classList.toggle('hidden', currentQuestion === 0);
  submitBtn.classList.remove('show');

  const selectedIdx = answers[q.id];

  let optionsHtml = '';
  q.options.forEach((opt, idx) => {
    const selectedClass = selectedIdx === idx ? ' selected' : '';
    optionsHtml += `<button class="option-btn${selectedClass}" onclick="selectOption('${q.id}', ${idx})">${opt.text}</button>`;
  });

  document.getElementById('questionArea').innerHTML = `
    <div class="question-card">
      <div class="question-label">第 ${currentQuestion + 1} 题</div>
      <div class="question-text">${q.text}</div>
      <div class="options">${optionsHtml}</div>
    </div>
  `;
}

let advancing = false;

function selectOption(questionId, optionIndex) {
  answers[questionId] = optionIndex;

  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((btn, idx) => {
    btn.classList.toggle('selected', idx === optionIndex);
  });

  updateProgress();

  if (advancing) return;

  const isLast = currentQuestion === shuffledQuestions.length - 1;

  if (isLast) {
    const allAnswered = shuffledQuestions.every(q => answers[q.id] !== undefined);
    if (allAnswered) {
      advancing = true;
      setTimeout(() => submitTest(), 400);
    }
  } else {
    advancing = true;
    setTimeout(() => {
      currentQuestion++;
      renderQuestion();
      updateProgress();
      advancing = false;
    }, 400);
  }
}

function prevQuestion() {
  if (currentQuestion > 0) {
    currentQuestion--;
    renderQuestion();
    updateProgress();
  }
}

function updateProgress() {
  const total = shuffledQuestions.length;
  const answered = Object.keys(answers).length;
  const current = currentQuestion + 1;
  document.getElementById('progressText').textContent = `${current}/${total}`;
  document.getElementById('progressFill').style.width = `${(answered / total) * 100}%`;
}

function calcResult() {
  const dimScores = { EI: 0, SN: 0, TF: 0, JP: 0 };

  shuffledQuestions.forEach(q => {
    const optIdx = answers[q.id];
    if (optIdx !== undefined && q.options[optIdx]) {
      dimScores[q.dim] += q.options[optIdx].score;
    }
  });

  let type = '';
  const dims = {};
  const dimMap = { EI: ['E', 'I'], SN: ['S', 'N'], TF: ['T', 'F'], JP: ['J', 'P'] };

  for (const dim of ['EI', 'SN', 'TF', 'JP']) {
    const score = dimScores[dim];
    const leftPct = Math.round((score - 7) / 14 * 100);
    const rightPct = 100 - leftPct;

    dims[dim] = { left: leftPct, right: rightPct };

    if (score > 14) {
      type += dimMap[dim][0];
    } else {
      type += dimMap[dim][1];
    }
  }

  return { type, dims };
}

function submitTest() {
  showPage('loading');
  setTimeout(() => {
    const result = calcResult();
    renderResult(result);
    showPage('results');
  }, 1500);
}

function renderResult(result) {
  const typeData = TYPES[result.type];
  if (!typeData) return;

  const dimLabels = {
    EI: { left: '外向 E', right: '内向 I' },
    SN: { left: '实感 S', right: '直觉 N' },
    TF: { left: '思考 T', right: '情感 F' },
    JP: { left: '判断 J', right: '感知 P' }
  };

  let dimsHtml = '';
  for (const dim of ['EI', 'SN', 'TF', 'JP']) {
    const d = result.dims[dim];
    const labels = dimLabels[dim];
    dimsHtml += `
      <div class="dim-row">
        <span class="dim-label">${labels.left}</span>
        <span class="dim-pct left">${d.left}%</span>
        <div class="dim-bar-track">
          <div class="dim-bar-fill" style="width: ${d.left}%"></div>
        </div>
        <span class="dim-pct right">${d.right}%</span>
        <span class="dim-label right">${labels.right}</span>
      </div>
    `;
  }

  let strengthsHtml = '';
  if (typeData.strengths) {
    typeData.strengths.forEach(s => {
      strengthsHtml += `<li>${s}</li>`;
    });
  }

  let weaknessesHtml = '';
  if (typeData.weaknesses) {
    typeData.weaknesses.forEach(w => {
      weaknessesHtml += `<li>${w}</li>`;
    });
  }

  let celebsHtml = '';
  if (typeData.celebs) {
    typeData.celebs.forEach(c => {
      celebsHtml += `<span class="celeb-tag">${c}</span>`;
    });
  }

  document.getElementById('resultContent').innerHTML = `
    <div class="result-main-card">
      <div class="result-emoji">${typeData.emoji || ''}</div>
      <div class="result-info">
        <h2>${typeData.name || result.type}</h2>
        <div class="result-code">${result.type}</div>
        <div class="result-desc">${typeData.desc || ''}</div>
      </div>
    </div>

    <div class="dims-card">
      <h3>维度得分</h3>
      ${dimsHtml}
    </div>

    <div class="traits-grid">
      <div class="traits-card">
        <h3>优势</h3>
        <ul>${strengthsHtml}</ul>
      </div>
      <div class="traits-card">
        <h3>劣势</h3>
        <ul>${weaknessesHtml}</ul>
      </div>
    </div>

    <div class="celebs-card">
      <h3>代表人物</h3>
      <div class="celebs-list">${celebsHtml}</div>
    </div>

    <div class="tip-card">
      <h3>友情提示</h3>
      <p>${typeData.tip || ''}</p>
    </div>

    <div class="watermark" id="watermark">
      <div class="wm-title">MBTI 人格测试</div>
      <div class="wm-link">分享给朋友一起测试吧</div>
    </div>
  `;
}

function saveAsImage() {
  const watermark = document.getElementById('watermark');
  const resultContent = document.getElementById('resultContent');

  watermark.style.display = 'block';

  html2canvas(resultContent, {
    backgroundColor: '#fafafa',
    scale: 2,
    useCORS: true,
    scrollY: -window.scrollY
  }).then(canvas => {
    watermark.style.display = 'none';
    const link = document.createElement('a');
    link.download = 'mbti-result.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }).catch(() => {
    watermark.style.display = 'none';
  });
}
</script>
