<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 人格测试</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #fafafa;
  color: #1a1a1a;
  min-height: 100vh;
}

.container {
  max-width: 780px;
  margin: 0 auto;
  padding: 0 20px;
}

.page {
  display: none;
  min-height: 100vh;
}

.page.active {
  display: flex;
  flex-direction: column;
}

/* ========== 首页 ========== */
#intro {
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 40px 20px;
}

#intro h1 {
  font-size: 2.4rem;
  font-weight: 700;
  margin-bottom: 16px;
  letter-spacing: -0.5px;
}

#intro .subtitle {
  font-size: 1.1rem;
  color: #888;
  margin-bottom: 48px;
}

#intro .start-btn {
  display: inline-block;
  background: #000;
  color: #fff;
  border: none;
  padding: 16px 48px;
  font-size: 1.1rem;
  font-weight: 500;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s;
  font-family: inherit;
}

#intro .start-btn:hover {
  background: #333;
}

#intro .disclaimer {
  margin-top: 48px;
  font-size: 0.85rem;
  color: #888;
}

/* ========== 答题页 ========== */
#quiz {
  min-height: 100vh;
  padding-bottom: 80px;
}

.progress-bar-wrapper {
  position: sticky;
  top: 0;
  background: #fafafa;
  padding: 16px 0 12px;
  z-index: 10;
}

.progress-text {
  font-size: 0.85rem;
  color: #888;
  margin-bottom: 8px;
  text-align: right;
}

.progress-track {
  width: 100%;
  height: 4px;
  background: #e8e8e4;
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: #000;
  border-radius: 2px;
  transition: width 0.3s ease;
  width: 0%;
}

.question-card {
  background: #fff;
  border: 1px solid #e8e8e4;
  border-radius: 14px;
  padding: 36px 32px;
  margin-top: 24px;
  flex: 1;
}

.question-label {
  font-size: 0.85rem;
  color: #888;
  margin-bottom: 12px;
  font-weight: 500;
}

.question-text {
  font-size: 1.3rem;
  font-weight: 600;
  margin-bottom: 32px;
  line-height: 1.6;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.option-btn {
  display: block;
  width: 100%;
  text-align: left;
  background: #fff;
  border: 1.5px solid #e8e8e4;
  border-radius: 8px;
  padding: 16px 20px;
  font-size: 1rem;
  line-height: 1.5;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  font-family: inherit;
  color: #1a1a1a;
}

.option-btn:hover {
  background: #f5f5f5;
}

.option-btn.selected {
  border-color: #000;
  background: #f5f5f5;
}

.quiz-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #fafafa;
  border-top: 1px solid #e8e8e4;
  padding: 16px 20px;
  z-index: 10;
}

.quiz-nav .container {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.prev-btn {
  background: none;
  border: 1.5px solid #e8e8e4;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 0.95rem;
  cursor: pointer;
  color: #1a1a1a;
  transition: border-color 0.2s, background 0.2s;
  font-family: inherit;
}

.prev-btn:hover {
  border-color: #000;
  background: #f5f5f5;
}

.prev-btn.hidden {
  visibility: hidden;
}

.submit-btn {
  background: #000;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 24px;
  font-size: 0.95rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s;
  font-family: inherit;
  display: none;
}

.submit-btn:hover {
  background: #333;
}

.submit-btn.show {
  display: block;
}

/* ========== 加载页 ========== */
#loading {
  justify-content: center;
  align-items: center;
  text-align: center;
}

.loading-text {
  font-size: 1.3rem;
  font-weight: 500;
  margin-bottom: 24px;
}

.dots {
  display: flex;
  gap: 8px;
  justify-content: center;
}

.dot {
  width: 10px;
  height: 10px;
  background: #000;
  border-radius: 50%;
  animation: bounce 1.2s infinite ease-in-out;
}

.dot:nth-child(2) {
  animation-delay: 0.2s;
}

.dot:nth-child(3) {
  animation-delay: 0.4s;
}

@keyframes bounce {
  0%, 80%, 100% {
    transform: translateY(0);
    opacity: 0.3;
  }
  40% {
    transform: translateY(-12px);
    opacity: 1;
  }
}

/* ========== 结果页 ========== */
#results {
  padding: 40px 0 60px;
  min-height: auto;
}

#resultContent {
  background: #fafafa;
  padding: 0 20px 40px;
}

.result-main-card {
  background: #fff;
  border: 1px solid #e8e8e4;
  border-radius: 14px;
  padding: 36px 32px;
  display: flex;
  gap: 28px;
  align-items: flex-start;
  margin-bottom: 24px;
}

.result-emoji {
  font-size: 3.6rem;
  flex-shrink: 0;
}

.result-info h2 {
  font-size: 1.6rem;
  font-weight: 700;
  margin-bottom: 4px;
}

.result-code {
  font-size: 1.1rem;
  color: #888;
  font-weight: 500;
  margin-bottom: 14px;
}

.result-desc {
  font-size: 0.95rem;
  line-height: 1.8;
  color: #555;
}

.dims-card {
  background: #fff;
  border: 1px solid #e8e8e4;
  border-radius: 14px;
  padding: 28px 32px;
  margin-bottom: 24px;
}

.dims-card h3 {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 20px;
}

.dim-row {
  display: flex;
  align-items: center;
  margin-bottom: 16px;
  gap: 12px;
}

.dim-row:last-child {
  margin-bottom: 0;
}

.dim-label {
  font-size: 0.9rem;
  font-weight: 500;
  width: 56px;
  text-align: right;
  flex-shrink: 0;
}

.dim-label.right {
  text-align: left;
}

.dim-bar-track {
  flex: 1;
  height: 10px;
  background: #e8e8e4;
  border-radius: 5px;
  overflow: hidden;
}

.dim-bar-fill {
  height: 100%;
  background: #000;
  border-radius: 5px;
  transition: width 0.5s ease;
}

.dim-pct {
  font-size: 0.85rem;
  color: #888;
  width: 40px;
  flex-shrink: 0;
}

.dim-pct.left {
  text-align: right;
}

.dim-pct.right {
  text-align: left;
}

.traits-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}

.traits-card {
  background: #fff;
  border: 1px solid #e8e8e4;
  border-radius: 14px;
  padding: 24px;
}

.traits-card h3 {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 14px;
}

.traits-card ul {
  list-style: none;
  padding: 0;
}

.traits-card li {
  font-size: 0.9rem;
  color: #555;
  line-height: 1.6;
  padding: 4px 0;
}

.traits-card li::before {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  background: #000;
  border-radius: 50%;
  margin-right: 10px;
  vertical-align: middle;
}

.celebs-card {
  background: #fff;
  border: 1px solid #e8e8e4;
  border-radius: 14px;
  padding: 28px 32px;
  margin-bottom: 24px;
}

.celebs-card h3 {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 16px;
}

.celebs-list {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.celeb-tag {
  background: #f5f5f5;
  border: 1px solid #e8e8e4;
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 0.9rem;
}

.tip-card {
  background: #fff;
  border: 1px solid #e8e8e4;
  border-radius: 14px;
  padding: 24px 32px;
  margin-bottom: 24px;
}

.tip-card h3 {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 10px;
}

.tip-card p {
  font-size: 0.9rem;
  color: #555;
  line-height: 1.8;
}

.watermark {
  display: none;
  text-align: center;
  padding: 20px 0 8px;
  border-top: 1px solid #e8e8e4;
  margin-top: 16px;
}

.watermark .wm-title {
  font-size: 0.9rem;
  font-weight: 500;
  color: #888;
}

.watermark .wm-link {
  font-size: 0.8rem;
  color: #aaa;
  margin-top: 4px;
}

.result-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  padding: 0 20px;
  margin-top: 24px;
}

.save-btn {
  background: #000;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 14px 32px;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s;
  font-family: inherit;
}

.save-btn:hover {
  background: #333;
}

.restart-btn {
  background: #fff;
  color: #1a1a1a;
  border: 1.5px solid #e8e8e4;
  border-radius: 8px;
  padding: 14px 32px;
  font-size: 1rem;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  font-family: inherit;
}

.restart-btn:hover {
  border-color: #000;
  background: #f5f5f5;
}

/* ========== 响应式 ========== */
@media (max-width: 600px) {
  #intro h1 {
    font-size: 1.8rem;
  }

  .question-card {
    padding: 28px 20px;
  }

  .question-text {
    font-size: 1.15rem;
  }

  .result-main-card {
    flex-direction: column;
    padding: 28px 20px;
    gap: 16px;
  }

  .traits-grid {
    grid-template-columns: 1fr;
  }

  .dims-card,
  .celebs-card,
  .tip-card {
    padding: 20px;
  }

  .result-actions {
    flex-direction: column;
  }

  .result-actions button {
    width: 100%;
  }
}
</style>
</head>
<body>

<!-- 首页 -->
<div id="intro" class="page active">
  <div class="container">
    <h1>你是什么人格？</h1>
    <p class="subtitle">28 道有趣的题目，测出你的 MBTI 类型</p>
    <button class="start-btn" onclick="startTest()">开始测试</button>
    <p class="disclaimer">本测试仅供娱乐，请勿当真</p>
  </div>
</div>

<!-- 答题页 -->
<div id="quiz" class="page">
  <div class="container">
    <div class="progress-bar-wrapper">
      <div class="progress-text" id="progressText">1/28</div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
    <div id="questionArea"></div>
  </div>
  <div class="quiz-nav">
    <div class="container">
      <button class="prev-btn hidden" id="prevBtn" onclick="prevQuestion()">上一题</button>
      <button class="submit-btn" id="submitBtn" onclick="submitTest()">查看结果</button>
    </div>
  </div>
</div>

<!-- 加载页 -->
<div id="loading" class="page">
  <div>
    <div class="loading-text">正在分析你的人格...</div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</div>

<!-- 结果页 -->
<div id="results" class="page">
  <div class="container">
    <div id="resultContent">
      <!-- 动态渲染 -->
    </div>
    <div class="result-actions">
      <button class="save-btn" onclick="saveAsImage()">保存结果图片</button>
      <button class="restart-btn" onclick="startTest()">重新测试</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    id: 1,
    text: "凌晨三点你还没睡，手机弹出一条消息：\"楼下有只猫在叫，疑似在开演唱会\"，你的反应是？",
    dim: "EI",
    options: [{"text": "穿上拖鞋冲下去看，顺便拍个抖音", "score": 3}, {"text": "看一眼窗外，默默点个赞然后继续刷手机", "score": 2}, {"text": "关窗，塞耳塞，这个世界与我无关", "score": 1}]
  },
  {
    id: 2,
    text: "你搬进新家，发现阳台外面能看到一棵特别大的树，你第一反应是？",
    dim: "SN",
    options: [{"text": "不错，夏天能遮阳，省点空调费", "score": 3}, {"text": "挺好的，看着挺舒服", "score": 2}, {"text": "这棵树看了多少年的人间故事了……会不会有松鼠住在里面", "score": 1}]
  },
  {
    id: 3,
    text: "你点了一杯奶茶，喝了一口发现是别人的单，但是比你点的贵，这时候你会？",
    dim: "TF",
    options: [{"text": "赚到了，闷声喝完，商业互换", "score": 3}, {"text": "犹豫三秒，然后跟店员说一声", "score": 2}, {"text": "立刻归还，万一那个人正在期待他的奶茶呢", "score": 1}]
  },
  {
    id: 4,
    text: "周五下午老板突然说\"下周一交个方案\"，你会？",
    dim: "JP",
    options: [{"text": "当场掏出笔记本列大纲，周五晚上搞定初稿", "score": 3}, {"text": "先记下来，周末抽空弄弄", "score": 2}, {"text": "周日晚上十一点打开电脑，灵感这东西急不来的", "score": 1}]
  },
  {
    id: 5,
    text: "电梯里只有你和一个陌生人，电梯突然停了，你会？",
    dim: "EI",
    options: [{"text": "主动搭话：\"哥们，看来咱俩命中注定要聊一会儿了\"", "score": 3}, {"text": "默默掏出手机看看有没有信号，偶尔对视一下尬笑", "score": 2}, {"text": "面朝墙角站好，假装自己是一盆绿植", "score": 1}]
  },
  {
    id: 6,
    text: "朋友带你去一家新开的餐厅，菜单上有一道叫\"老板娘的秘密\"的菜，你会？",
    dim: "SN",
    options: [{"text": "先问服务员这道菜具体是什么食材、怎么做的", "score": 3}, {"text": "看看隔壁桌有没有人点了，瞄一眼实物", "score": 2}, {"text": "不管了直接点，人生就是要充满惊喜", "score": 1}]
  },
  {
    id: 7,
    text: "好朋友跟你吐槽工作不顺心想裸辞，你第一反应是？",
    dim: "TF",
    options: [{"text": "帮他分析存款够撑几个月、行业形势怎么样", "score": 3}, {"text": "先听他说完，然后提一两个建议", "score": 2}, {"text": "\"要不咱俩先去吃顿好的，难受的事吃饱了再说\"", "score": 1}]
  },
  {
    id: 8,
    text: "你终于等到年假了，距离出发还有两周，你现在的状态是？",
    dim: "JP",
    options: [{"text": "攻略已做好，机票酒店门票全订完，连每天几点起床都规划了", "score": 3}, {"text": "大方向定了，细节到时候再说", "score": 2}, {"text": "去哪还没定呢，出发前一晚订机票也不迟吧", "score": 1}]
  },
  {
    id: 9,
    text: "公司团建要玩狼人杀，你会？",
    dim: "EI",
    options: [{"text": "主动竞选法官或者上来就自爆身份带节奏", "score": 3}, {"text": "安静观察，关键时刻发言投票", "score": 2}, {"text": "能不能申请当观众，我给你们端茶倒水", "score": 1}]
  },
  {
    id: 10,
    text: "地铁上你看到一个人鞋子穿反了，你的内心活动是？",
    dim: "SN",
    options: [{"text": "穿反了……走路不磨脚吗，这人心真大", "score": 3}, {"text": "看了一眼，没太在意", "score": 2}, {"text": "他是不是今早经历了什么惊天动地的事才会穿反鞋出门", "score": 1}]
  },
  {
    id: 11,
    text: "室友/伴侣做了一顿饭，味道一言难尽，你会？",
    dim: "TF",
    options: [{"text": "\"盐放多了，下次少放一半，火候也要注意\"", "score": 3}, {"text": "一边吃一边说\"还行还行\"，然后默默多喝两口水", "score": 2}, {"text": "\"天哪你居然亲手做了饭！我好感动！\"（含泪吃完）", "score": 1}]
  },
  {
    id: 12,
    text: "你网购了一堆东西，快递到了五个，你会？",
    dim: "JP",
    options: [{"text": "按下单顺序一个一个拆，拆完顺手把纸箱折好归类", "score": 3}, {"text": "挑最期待的先拆，其他等会儿再说", "score": 2}, {"text": "全堆在门口，这两天想起来了就拆一个", "score": 1}]
  },
  {
    id: 13,
    text: "你在咖啡厅工作，旁边的人在大声打电话，你会？",
    dim: "EI",
    options: [{"text": "忍不住搭个话：\"哥们声音小点呗\"，顺便聊两句", "score": 3}, {"text": "戴上耳机默默忍受，偶尔翻个白眼", "score": 2}, {"text": "二话不说换个角落的位子，最好周围三米没有人", "score": 1}]
  },
  {
    id: 14,
    text: "你在超市看到一种从没见过的水果，包装上写着\"口感神秘\"，你会？",
    dim: "SN",
    options: [{"text": "先扫码查一下是什么品种、产地、怎么吃", "score": 3}, {"text": "看看价格，不贵就买一个试试", "score": 2}, {"text": "立刻放进购物车，\"口感神秘\"四个字已经说服我了", "score": 1}]
  },
  {
    id: 15,
    text: "你排了半小时的队，快到你的时候有人插队，你会？",
    dim: "TF",
    options: [{"text": "直接指出来：\"不好意思，麻烦排队\"，公平就是公平", "score": 3}, {"text": "皱个眉头看看前后的人有没有人先开口", "score": 2}, {"text": "算了吧，他可能有急事，多等两分钟也没啥", "score": 1}]
  },
  {
    id: 16,
    text: "你答应了周末帮朋友搬家，但那天早上下暴雨，你会？",
    dim: "JP",
    options: [{"text": "说好了就去，已经查好路线了，带上雨衣出发", "score": 3}, {"text": "先问朋友要不要改天，看对方态度决定", "score": 2}, {"text": "发消息说\"这雨也太大了吧\"，看朋友怎么接话再决定去不去", "score": 1}]
  },
  {
    id: 17,
    text: "朋友聚会上有一桌子你不认识的人，你会？",
    dim: "EI",
    options: [{"text": "坐下来先做自我介绍，十分钟后就跟每个人都聊上了", "score": 3}, {"text": "先找认识的人坐旁边，慢慢融入话题", "score": 2}, {"text": "全程跟手机做朋友，等朋友来了再说话", "score": 1}]
  },
  {
    id: 18,
    text: "你做了一个特别离谱的梦，醒来之后你会？",
    dim: "SN",
    options: [{"text": "想了两秒觉得太荒谬了，该起床起床", "score": 3}, {"text": "挺有意思的，跟朋友讲讲当个笑话", "score": 2}, {"text": "躺在床上反复回味细节，思考梦境在暗示什么人生真相", "score": 1}]
  },
  {
    id: 19,

    celebs: ["唐纳德·特朗普", "麦当娜", "杰克船长", "孙悟空"],
    tip: "你的冲劲让你走得快，但偶尔停下来想一想能让你走得更远。不是所有事情都需要立刻行动，有时候等一等会有更好的选择。"
  },
  "ESFP": {
    name: "表演者",
    emoji: "🎭",
    desc: "你就是那个走到哪里就把派对带到哪里的人。你自带聚光灯效果，笑容有感染力，说话有喜剧天赋。你热爱生活中的每一个瞬间，能把最普通的周末过成一场冒险。你的人生哲学是：人生苦短，及时行乐。",
    strengths: ["超强的感染力和表现力", "乐观积极，自带快乐光环", "善于社交，到哪都不怕", "活在当下，享受每一刻"],
    weaknesses: ["难以专注于一件事", "冲动消费的冠军选手", "逃避严肃和负面的话题", "长期规划约等于不存在"],
    celebs: ["玛丽莲·梦露", "威尔·史密斯", "哈利·波特的罗恩", "猪八戒"],
    tip: "你的快乐是真实的，也是珍贵的。但生活偶尔需要面对不那么开心的事，逃避不会让问题消失。学会在快乐和责任之间找到平衡。"
  }
};


let answers = {};
let currentQuestion = 0;
let shuffledQuestions;

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function startTest() {
  answers = {};
  currentQuestion = 0;
  advancing = false;
  shuffleQuestions();
  showPage('quiz');
  renderQuestion();
  updateProgress();
}

function shuffleQuestions() {
  const groups = { EI: [], SN: [], TF: [], JP: [] };
  QUESTIONS.forEach(q => {
    if (groups[q.dim]) {
      groups[q.dim].push(q);
    }
  });
  Object.keys(groups).forEach(dim => {
    const arr = groups[dim];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  });
  const dims = ['EI', 'SN', 'TF', 'JP'];
  shuffledQuestions = [];
  const maxLen = Math.max(...Object.values(groups).map(g => g.length));
  for (let i = 0; i < maxLen; i++) {
    for (const dim of dims) {
      if (i < groups[dim].length) {
        shuffledQuestions.push(groups[dim][i]);
      }
    }
  }
}

function renderQuestion() {
  const q = shuffledQuestions[currentQuestion];
  const prevBtn = document.getElementById('prevBtn');
  const submitBtn = document.getElementById('submitBtn');

  prevBtn.classList.toggle('hidden', currentQuestion === 0);
  submitBtn.classList.remove('show');

  const selectedIdx = answers[q.id];

  let optionsHtml = '';
  q.options.forEach((opt, idx) => {
    const selectedClass = selectedIdx === idx ? ' selected' : '';
    optionsHtml += `<button class="option-btn${selectedClass}" onclick="selectOption('${q.id}', ${idx})">${opt.text}</button>`;
  });

  document.getElementById('questionArea').innerHTML = `
    <div class="question-card">
      <div class="question-label">第 ${currentQuestion + 1} 题</div>
      <div class="question-text">${q.text}</div>
      <div class="options">${optionsHtml}</div>
    </div>
  `;
}

let advancing = false;

function selectOption(questionId, optionIndex) {
  answers[questionId] = optionIndex;

  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((btn, idx) => {
    btn.classList.toggle('selected', idx === optionIndex);
  });

  updateProgress();

  if (advancing) return;

  const isLast = currentQuestion === shuffledQuestions.length - 1;

  if (isLast) {
    const allAnswered = shuffledQuestions.every(q => answers[q.id] !== undefined);
    if (allAnswered) {
      advancing = true;
      setTimeout(() => submitTest(), 400);
    }
  } else {
    advancing = true;
    setTimeout(() => {
      currentQuestion++;
      renderQuestion();
      updateProgress();
      advancing = false;
    }, 400);
  }
}

function prevQuestion() {
  if (currentQuestion > 0) {
    currentQuestion--;
    renderQuestion();
    updateProgress();
  }
}

function updateProgress() {
  const total = shuffledQuestions.length;
  const answered = Object.keys(answers).length;
  const current = currentQuestion + 1;
  document.getElementById('progressText').textContent = `${current}/${total}`;
  document.getElementById('progressFill').style.width = `${(answered / total) * 100}%`;
}

function calcResult() {
  const dimScores = { EI: 0, SN: 0, TF: 0, JP: 0 };

  shuffledQuestions.forEach(q => {
    const optIdx = answers[q.id];
    if (optIdx !== undefined && q.options[optIdx]) {
      dimScores[q.dim] += q.options[optIdx].score;
    }
  });

  let type = '';
  const dims = {};
  const dimMap = { EI: ['E', 'I'], SN: ['S', 'N'], TF: ['T', 'F'], JP: ['J', 'P'] };

  for (const dim of ['EI', 'SN', 'TF', 'JP']) {
    const score = dimScores[dim];
    const leftPct = Math.round((score - 7) / 14 * 100);
    const rightPct = 100 - leftPct;

    dims[dim] = { left: leftPct, right: rightPct };

    if (score > 14) {
      type += dimMap[dim][0];
    } else {
      type += dimMap[dim][1];
    }
  }

  return { type, dims };
}

function submitTest() {
  showPage('loading');
  setTimeout(() => {
    const result = calcResult();
    renderResult(result);
    showPage('results');
  }, 1500);
}

function renderResult(result) {
  const typeData = TYPES[result.type];
  if (!typeData) return;

  const dimLabels = {
    EI: { left: '外向 E', right: '内向 I' },
    SN: { left: '实感 S', right: '直觉 N' },
    TF: { left: '思考 T', right: '情感 F' },
    JP: { left: '判断 J', right: '感知 P' }
  };

  let dimsHtml = '';
  for (const dim of ['EI', 'SN', 'TF', 'JP']) {
    const d = result.dims[dim];
    const labels = dimLabels[dim];
    dimsHtml += `
      <div class="dim-row">
        <span class="dim-label">${labels.left}</span>
        <span class="dim-pct left">${d.left}%</span>
        <div class="dim-bar-track">
          <div class="dim-bar-fill" style="width: ${d.left}%"></div>
        </div>
        <span class="dim-pct right">${d.right}%</span>
        <span class="dim-label right">${labels.right}</span>
      </div>
    `;
  }

  let strengthsHtml = '';
  if (typeData.strengths) {
    typeData.strengths.forEach(s => {
      strengthsHtml += `<li>${s}</li>`;
    });
  }

  let weaknessesHtml = '';
  if (typeData.weaknesses) {
    typeData.weaknesses.forEach(w => {
      weaknessesHtml += `<li>${w}</li>`;
    });
  }

  let celebsHtml = '';
  if (typeData.celebs) {
    typeData.celebs.forEach(c => {
      celebsHtml += `<span class="celeb-tag">${c}</span>`;
    });
  }

  document.getElementById('resultContent').innerHTML = `
    <div class="result-main-card">
      <div class="result-emoji">${typeData.emoji || ''}</div>
      <div class="result-info">
        <h2>${typeData.name || result.type}</h2>
        <div class="result-code">${result.type}</div>
        <div class="result-desc">${typeData.desc || ''}</div>
      </div>
    </div>

    <div class="dims-card">
      <h3>维度得分</h3>
      ${dimsHtml}
    </div>

    <div class="traits-grid">
      <div class="traits-card">
        <h3>优势</h3>
        <ul>${strengthsHtml}</ul>
      </div>
      <div class="traits-card">
        <h3>劣势</h3>
        <ul>${weaknessesHtml}</ul>
      </div>
    </div>

    <div class="celebs-card">
      <h3>代表人物</h3>
      <div class="celebs-list">${celebsHtml}</div>
    </div>

    <div class="tip-card">
      <h3>友情提示</h3>
      <p>${typeData.tip || ''}</p>
    </div>

    <div class="watermark" id="watermark">
      <div class="wm-title">MBTI 人格测试</div>
      <div class="wm-link">分享给朋友一起测试吧</div>
    </div>
  `;
}

function saveAsImage() {
  const watermark = document.getElementById('watermark');
  const resultContent = document.getElementById('resultContent');

  watermark.style.display = 'block';

  html2canvas(resultContent, {
    backgroundColor: '#fafafa',
    scale: 2,
    useCORS: true,
    scrollY: -window.scrollY
  }).then(canvas => {
    watermark.style.display = 'none';
    const link = document.createElement('a');
    link.download = 'mbti-result.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }).catch(() => {
    watermark.style.display = 'none';
  });
}
</script>
